# Pull Requests: Tests und Cross-Compile für alle Zielplattformen.
name: ci

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # neuester Patch von Go 1.26: Sicherheitskorrekturen der Standardbibliothek
          go-version: "1.26.x"
          check-latest: true
      - run: go vet ./... && go test ./...
      - name: Terminal-Emulator (eigene Kopie in third_party/vt)
        run: cd third_party/vt && go test ./...
      - name: ANSI-Parser (eigene Kopie in third_party/ansi)
        run: cd third_party/ansi && go test ./...
      - name: Lasttest mit 1000 Hosts
        run: make loadtest
      # Bildschirm-Tests: abweichende Bilder zum Ansehen hochladen
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: golden-actual
          path: internal/ui/testdata/golden-actual/
          if-no-files-found: ignore
      - name: Cross-Compile
        run: |
          for t in windows/arm64 windows/386 windows/amd64 darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 linux/arm linux/riscv64; do
            CGO_ENABLED=0 GOARM=7 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/sshtermy
          done

  # Datenrennen (Terminal-Emulator, Vermittler, SSH) früh finden
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # neuester Patch von Go 1.26: Sicherheitskorrekturen der Standardbibliothek
          go-version: "1.26.x"
          check-latest: true
      - run: go test -race ./...

  # Tests auch auf echtem Windows und macOS (ConPTY, DPAPI, Schlüsselbund, Pfade)
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - run: go test ./...
      - run: cd third_party/vt && go test ./...
      - run: cd third_party/ansi && go test ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: golden-actual-${{ matrix.os }}
          path: internal/ui/testdata/golden-actual/
          if-no-files-found: ignore

  # Bekannte Sicherheitslücken in Go und allen Bibliotheken, die wirklich aufgerufen werden
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Parser für Daten von fremden Geräten kurz mit Zufallsdaten beschießen
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - run: FUZZTIME=15s tools/fuzz/run.sh
      - name: ANSI-Parser (third_party/ansi)
        run: cd third_party/ansi && go test -run '^$' -fuzz '^FuzzDecodeSequence$' -fuzztime 15s .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-funde
          path: internal/**/testdata/fuzz/
          if-no-files-found: ignore

  packaging:
    # ubuntu-latest (26.04) holte apt-utils am 2026-11-11 stundenlang nur von
    # security.ubuntu.com, das der Runner nicht auflösen konnte.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Paketquellen können kurz nicht erreichbar sein (DNS beim Runner):
      # Liste auffrischen und bis zu dreimal versuchen.
      - run: |
          if command -v apt-ftparchive >/dev/null && python3 -c 'import yaml' 2>/dev/null; then exit 0; fi
          for i in 1 2 3; do
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq apt-utils python3-yaml >/dev/null && exit 0
            sleep $((i * 10))
          done
          exit 1
      - run: packaging/check.sh
