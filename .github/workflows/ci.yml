# Pull Requests: Tests und Cross-Compile für alle Zielplattformen.
name: ci

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # neuester Patch von Go 1.26: Sicherheitskorrekturen der Standardbibliothek
          go-version: "1.26.x"
          check-latest: true
      - run: go vet ./... && go test ./...
      - name: Terminal-Emulator (eigene Kopie in third_party/vt)
        run: cd third_party/vt && go test ./...
      - name: Lasttest mit 1000 Hosts
        run: make loadtest
      # Bildschirm-Tests: abweichende Bilder zum Ansehen hochladen
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: golden-actual
          path: internal/ui/testdata/golden-actual/
          if-no-files-found: ignore
      - name: Cross-Compile
        run: |
          for t in windows/arm64 windows/386 windows/amd64 darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 linux/arm linux/riscv64; do
            CGO_ENABLED=0 GOARM=7 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/sshtermy
          done

  # Datenrennen (Terminal-Emulator, Vermittler, SSH) früh finden
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # neuester Patch von Go 1.26: Sicherheitskorrekturen der Standardbibliothek
          go-version: "1.26.x"
          check-latest: true
      - run: go test -race ./...

  # Tests auch auf echtem Windows und macOS (ConPTY, DPAPI, Schlüsselbund, Pfade)
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - run: go test ./...
      - run: cd third_party/vt && go test ./...
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: golden-actual-${{ matrix.os }}
          path: internal/ui/testdata/golden-actual/
          if-no-files-found: ignore

  # Bekannte Sicherheitslücken in Go und allen Bibliotheken, die wirklich aufgerufen werden
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Parser für Daten von fremden Geräten kurz mit Zufallsdaten beschießen
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - run: FUZZTIME=15s tools/fuzz/run.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-funde
          path: internal/**/testdata/fuzz/
          if-no-files-found: ignore

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y -qq apt-utils python3-yaml >/dev/null
      - run: packaging/check.sh
