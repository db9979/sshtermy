id: cisco-asa
name: Cisco ASA
order: 213
hint: "Cisco ASA (Firewall), kein IOS: show running-config, show interface ip brief, show nameif, show route, show conn count, show xlate, show access-list, show vpn-sessiondb summary, show failover; Blättern aus mit terminal pager 0; Konfiguration mit configure terminal … end, speichern mit write memory. Schnittstellen haben Namen (nameif, z. B. inside/outside)."
detect:
  screen: ['(?i)cisco adaptive security appliance']
  version: ['(?i)cisco adaptive security appliance']
commands:
  paging_off: terminal pager 0
  version: show version
  system: show cpu usage
  memory: show memory
  ports: show interface ip brief
  config: show running-config
  extra:
    - label: Verbindungen
      label_en: Connections
      cmd: show conn count
      pick: '(?i)(\d+)\s+in use'
    - label: VPN
      cmd: show vpn-sessiondb summary
      pick: '(?im)^\s*Total Active and Inactive\s*:\s*(\d+)'
parse:
  firmware: '(?i)adaptive security appliance software version\s+(\S+)'
  model: '(?im)^Hardware:\s+([^,]+)'
  name: '(?im)^(\S+)\s+up\s+\d'
  uptime: '(?im)^\S+\s+up\s+(\d.*?)\s*$'
  cpu: '(?i)cpu utilization for 5 seconds\s*=\s*(\d{1,3})%'
  mem: '(?im)^Used memory:\s+\d+ bytes\s*\(\s*(\d{1,3})%\)'
logs:
  commands: [show logging]
  ports: show interface ip brief
  reader: generic
syslog:
  note: "ASA: configure terminal · logging enable · logging trap warnings · logging host <Schnittstelle, z. B. inside> <IP> 17/<Port> · end. Die Schnittstelle kennt sshTermy nicht, deshalb von Hand."
  save: write memory
danger:
  - rx: '^\s*clear\s+configure\b'
    reason: löscht Konfiguration oder Speicher des Geräts
  - rx: '^\s*no\s+(access-list|access-group|nat|crypto|route|object|nameif|ssh|http\s+server)\b'
    reason: entfernt Konfiguration (VLAN, Routing, Zugang)
  - rx: '^\s*(failover\s+active|no\s+failover)\b'
    reason: schaltet die Hochverfügbarkeit um
    reason_en: switches high availability over
samples:
  - name: ASA 5516
    version: |
      Cisco Adaptive Security Appliance Software Version 9.16(4)
      fw1 up 12 days 3 hours
      Hardware:   ASA5516, 8192 MB RAM, CPU Atom C2000 series 2416 MHz, 1 CPU (8 cores)
    system: |
      CPU utilization for 5 seconds = 4%; 1 minute: 3%; 5 minutes: 3%
      Free memory:        5312345678 bytes (62%)
      Used memory:        3214567890 bytes (38%)
    expect:
      firmware: 9.16(4)
      model: ASA5516
      name: fw1
      cpu: 4
      mem: 38
