id: huawei-vrp
name: Huawei VRP
order: 275
hint: "Huawei-VRP-CLI: display current-configuration, display interface brief, display vlan, display version, display logbuffer; Blättern aus mit screen-length 0 temporary; Konfiguration mit system-view … quit (neuere Geräte: danach commit), entfernen mit undo …, speichern mit save."
detect:
  banner: ['(?i)huawei']
  screen: ['(?i)huawei versatile routing platform']
  version: ['(?i)huawei versatile routing platform|VRP \(R\) software']
commands:
  paging_off: screen-length 0 temporary
  version: display version
  system: display cpu-usage
  memory: display memory-usage
  ports: display interface brief
  vlans: display vlan
  config: display current-configuration
parse:
  firmware: '(?i)VRP \(R\) software,\s*Version\s+([\d.]+\s*\([^)]*\))'
  model: '(?im)^HUAWEI\s+(\S+).*?uptime is'
  cpu: '(?im)^\s*CPU Usage\s*:\s*(\d{1,3})%'
  mem: '(?i)memory (?:using|utilization) percentage is\s*:\s*(\d{1,3})%'
  port_up: '^\s*(?:X|25|40|100|Multi)?(?:GE|GigabitEthernet|Ethernet|MultiGE)\d\S*\s+up\b'
  port_down: '^\s*(?:X|25|40|100|Multi)?(?:GE|GigabitEthernet|Ethernet|MultiGE)\d\S*\s+\*?down\b'
  vlan: '^(\d{1,4})\s+(?:enable|disable)\s+\S+\s+\S+\s+\S+\s+(.*?)\s*$'
logs:
  commands: [display logbuffer]
  ports: display interface brief
  reader: vrp
syslog:
  steps: [system-view, info-center enable, 'info-center loghost {{ip}} port {{port}}', quit]
  save: save
danger:
  - rx: '^\s*undo\s+(vlan|interface|ip\s+route-static|stp|local-user|stelnet|ip\s+address|info-center\s+enable)\b'
    reason: entfernt Konfiguration (VLAN, Routing, Zugang)
  - rx: '^\s*(startup\s+(saved-configuration|system-software)|clear\s+configuration)\b'
    reason: ändert die Startkonfiguration oder das Startabbild
    reason_en: changes the startup configuration or boot image
samples:
  - name: Huawei S5735
    version: |
      Huawei Versatile Routing Platform Software
      VRP (R) software, Version 5.170 (S5735 V200R019C10SPC500)
      Copyright (C) 2000-2020 HUAWEI TECH Co., Ltd.
      HUAWEI S5735-L24T4S-A1 Routing Switch uptime is 0 week, 2 days, 3 hours, 15 minutes
    system: |
      CPU Usage Stat. Cycle: 60 (Second)
      CPU Usage            : 6% Max: 30%
      Memory utilization statistics at 2026-11-10 10:00:00+01:00
      System Total Memory Is: 536870912 bytes
      Total Memory Used Is: 283678464 bytes
      Memory Using Percentage Is: 52%
    ports: |
      Interface                   PHY   Protocol  InUti OutUti   inErrors  outErrors
      GigabitEthernet0/0/1        up    up           0%     0%          0          0
      GigabitEthernet0/0/2        down  down         0%     0%          0          0
      XGigabitEthernet0/0/1       *down down         0%     0%          0          0
    vlans: |
      VID  Status  Property      MAC-LRN Statistics Description
      --------------------------------------------------------------------------------
      1    enable  default       enable  disable    VLAN 0001
      10   enable  default       enable  disable    Server
    logs: |
      Nov 10 2026 10:21:33 HUAWEI %%01SHELL/5/CMDRECORD(s)[3]:Recorded command information. (Task=VT0, User=admin)
      Nov 10 2026 10:22:00+01:00 HUAWEI %%01IFNET/4/IF_STATE(l)[4]:Interface GigabitEthernet0/0/2 has turned into DOWN state.
    expect:
      firmware: 5.170 (S5735 V200R019C10SPC500)
      model: S5735-L24T4S-A1
      cpu: 6
      mem: 52
      ports_up: 1
      ports_down: 2
      vlans: 2
      log_lines: 2
