id: vyos
name: VyOS
family: linux
order: 130
hint: "VyOS (Router auf Debian-Basis): Betriebsmodus show interfaces, show ip route, show version, show log; Konfiguration mit configure · set …/delete … · commit · save · exit; compare zeigt offene Änderungen, rollback geht zurück. Normale Linux-Befehle gibt es auch, die Konfiguration aber nur über configure."
detect:
  screen: ['(?i)welcome to vyos']
  probe: [/usr/libexec/vyos]
danger:
  - rx: '^\s*(load\s+\S|rollback\s+\d|reboot\s+now\b|poweroff\s+now\b)'
    reason: überschreibt die Gerätekonfiguration
