id: arista-eos
name: Arista EOS
order: 230
hint: "Arista EOS (IOS-ähnlich, aber eigene Befehle): show running-config, show interfaces status, show vlan, show mac address-table, show lldp neighbors, show version; Blättern aus mit terminal length 0; Konfiguration mit configure … end (oder configure session), speichern mit write memory. bash öffnet eine Linux-Shell."
detect:
  screen: ['(?i)arista networks|\barista\s+dcs-|\bEOS-\d']
  version: ['(?im)^arista\s|software image version:']
commands:
  paging_off: terminal length 0
  version: show version
  system: show processes top once
  ports: show interfaces status
  vlans: show vlan
  config: show running-config
parse:
  firmware: '(?im)^Software image version:\s*(\S+)'
  model: '(?im)^Arista\s+(\S+)'
  cpu: '(?i)%cpu\(s\):.*?(?P<idle>\d{1,3})(?:\.\d+)?\s+id'
  mem: '(?is)total memory:\s+(?P<total>\d+)\s*kB.*?free memory:\s+(?P<free>\d+)'
logs:
  commands: [show logging]
  ports: show interfaces status
  reader: generic
syslog:
  steps: [configure, 'logging host {{ip}} {{port}}', logging trap warnings, end]
  save: write memory
samples:
  - name: DCS-7050
    version: |
      Arista DCS-7050SX-64-F
      Hardware version: 01.11
      Software image version: 4.28.3M
      Uptime: 3 weeks, 2 days, 4 hours and 1 minute
      Total memory: 8099828 kB
      Free memory: 5998672 kB
    expect:
      firmware: 4.28.3M
      model: DCS-7050SX-64-F
      mem: 25
