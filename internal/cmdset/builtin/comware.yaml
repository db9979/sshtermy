id: comware
name: HPE Comware / H3C
order: 270
hint: "Comware-CLI: display current-configuration, display interface brief, display vlan, display version, display logbuffer; Blättern aus mit screen-length disable; Konfiguration mit system-view … quit, entfernen mit undo …, speichern mit save force."
detect:
  banner: ['(?i)comware|h3c']
  screen: ['(?i)comware']
  version: ['(?i)comware software']
commands:
  paging_off: screen-length disable
  version: display version
  system: display cpu-usage
  memory: display memory
  ports: display interface brief
  vlans: display vlan brief
  config: display current-configuration
parse:
  firmware: '(?i)comware software,\s*version\s+([\d.]+,\s*release\s+\w+)'
  model: '(?im)^(?:H3C|HPE|HP)\s+(.+?)\s+uptime is'
  cpu: '(?im)^\s*(\d{1,3})%\s+in last 5 seconds'
  mem: '(?im)^\s*Mem:\s+(?P<total>\d+)\s+(?P<used>\d+)\s'
  port_up: '^(?:GE|XGE|FGE|HGE|WGE|MGE|BAGG|Ten-GigabitEthernet|GigabitEthernet)\d\S*\s+UP\b'
  port_down: '^(?:GE|XGE|FGE|HGE|WGE|MGE|BAGG|Ten-GigabitEthernet|GigabitEthernet)\d\S*\s+(?:DOWN|ADM)\b'
  vlan: '^\s*(\d{1,4})\s+(\S+(?: \S+)?)'
logs:
  commands: [display logbuffer]
  ports: display interface brief
  reader: vrp
syslog:
  steps: [system-view, info-center enable, 'info-center loghost {{ip}} port {{port}}', quit]
  save: save force
variants:
  - name: Comware 5
    firmware: '^5\.'
    hint: "Comware 5: info-center loghost kennt keinen Port (immer UDP 514), Speicherangabe mit display memory in Byte."
    syslog:
      steps: [system-view, info-center enable, 'info-center loghost {{ip}}', quit]
danger:
  - rx: '^\s*undo\s+(vlan|interface|ip\s+route|stp|local-user|ssh|ip\s+address|info-center\s+enable)\b'
    reason: entfernt Konfiguration (VLAN, Routing, Zugang)
  - rx: '^\s*(startup\s+saved-configuration|boot-loader\s+file)\b'
    reason: ändert die Startkonfiguration oder das Startabbild
    reason_en: changes the startup configuration or boot image
samples:
