id: junos
name: Juniper Junos
order: 240
hint: "Junos-CLI: show configuration | display set, show interfaces terse, show version, show chassis hardware; Konfiguration mit configure, set …, commit."
detect:
  screen: ['(?i)\bjunos\b']
  version: ['(?i)junos']
commands:
  paging_off: set cli screen-length 0
  version: show version
  system: show chassis routing-engine
  ports: show interfaces terse
  vlans: show vlans brief
  config: show configuration | display set
parse:
  reader: junos
logs:
  commands: [show log messages | last 600 | no-more]
  ports: show interfaces terse | no-more
  reader: junos
syslog:
  steps: [configure, 'set system syslog host {{ip}} any warning', 'set system syslog host {{ip}} port {{port}}', commit and-quit]
  abort: [rollback, exit configuration-mode]
# Firmware-Sicherheitshinweise: Produkt in der NVD (nur der Produktname wird gesendet).
advisory:
  cpe: [cpe:2.3:o:juniper:junos]
  version: '(?i)(\d+\.\d+[a-z]\d+(?:-s\d+)?)'
  url: https://supportportal.juniper.net/
